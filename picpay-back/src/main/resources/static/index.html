<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicPay - Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <img src="images/logo.svg" alt="PicPay" class="logo">
        </header>
        
        <main class="main-content">
            <h1 class="welcome-title">Bem-vindo ao painel administrativo</h1>
            
            <div class="cards-container">
                <div class="card">
                    <span class="card-label">Total</span>
                    <span class="card-value" id="count-total">0</span>
                </div>
                <div class="card">
                    <span class="card-label">Em análise</span>
                    <span class="card-value" id="count-analise">0</span>
                </div>
                <div class="card">
                    <span class="card-label">Aprovados</span>
                    <span class="card-value" id="count-aprovados">0</span>
                </div>
                <div class="card">
                    <span class="card-label">Reprovados</span>
                    <span class="card-value" id="count-reprovados">0</span>
                </div>
                <div class="card">
                    <span class="card-label">PicPay Lovers</span>
                    <span class="card-value" id="count-contratados">0</span>
                </div>
            </div>

            <div class="table-header-area">
                <h2 class="section-title">Funcionários</h2>
                
                <div class="actions-group">
                    <div class="search-box">
                        <img src="images/search-icon.svg" alt="Buscar" class="search-icon">
                        <input type="text" id="input-pesquisa" placeholder="Buscar">
                    </div>
                    <button class="btn-novo" onclick="abrirModalCadastro()">
                        <img src="images/add-icon.svg" alt="+" class="btn-icon"> Novo candidato
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Departamento</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-funcionarios">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
</body>
</html>
